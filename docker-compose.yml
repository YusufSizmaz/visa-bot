# Yerel gelistirme (sadece altyapi):   docker compose up -d sqlserver redis
# Tum sistem (API + Worker dahil):     docker compose --profile app up -d --build
# Worker'i yatay olcekleme:             docker compose --profile app up -d --scale worker=3

name: visa-telegram-bot

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:-VisaBot_Dev_Passw0rd!}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/VisaTelegramBot.WebApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: "Server=sqlserver,1433;Database=VisaTelegramBot;User Id=sa;Password=${SQL_SA_PASSWORD:-VisaBot_Dev_Passw0rd!};TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
      Database__ApplyMigrationsOnStartup: "true"
      Security__ApiKey: ${API_KEY:-dev-api-key-change-me-please}
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/VisaTelegramBot.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Database: "Server=sqlserver,1433;Database=VisaTelegramBot;User Id=sa;Password=${SQL_SA_PASSWORD:-VisaBot_Dev_Passw0rd!};TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
      # Bos birakilirsa Worker acilista anlasilir bir dogrulama hatasiyla durur (ValidateOnStart).
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__ChannelId: ${TELEGRAM_CHANNEL_ID:-}
    depends_on:
      sqlserver:
        condition: service_healthy
      # Migration'lari API uygular; Worker tablolar olusmadan baslamasin.
      api:
        condition: service_started
    restart: unless-stopped

  admin:
    profiles: ["app"]
    build:
      context: web/admin
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  sqlserver-data:
