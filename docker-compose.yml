# Yerel gelistirme (sadece altyapi):   docker compose up -d postgres redis
# Tum sistem (API + Worker dahil):     docker compose --profile app up -d --build
# Worker'i yatay olcekleme:             docker compose --profile app up -d --scale worker=3
#
# Uretim icin bu dosya kullanilmaz: compose.production.yaml'a ve DEPLOY.md'ye bakin.

name: visa-telegram-bot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: VisaTelegramBot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-VisaBot_Dev_Passw0rd!}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d VisaTelegramBot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/VisaTelegramBot.WebApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=VisaTelegramBot;Username=postgres;Password=${POSTGRES_PASSWORD:-VisaBot_Dev_Passw0rd!}"
      ConnectionStrings__Redis: "redis:6379"
      Database__ApplyMigrationsOnStartup: "true"
      Security__ApiKey: ${API_KEY:-dev-api-key-change-me-please}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/VisaTelegramBot.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=VisaTelegramBot;Username=postgres;Password=${POSTGRES_PASSWORD:-VisaBot_Dev_Passw0rd!}"
      ConnectionStrings__Redis: "redis:6379"
      # Bos birakilirsa Worker acilista anlasilir bir dogrulama hatasiyla durur (ValidateOnStart).
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__ChannelId: ${TELEGRAM_CHANNEL_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      # Migration'lari API uygular; Worker tablolar olusmadan baslamasin.
      api:
        condition: service_started
    restart: unless-stopped

  admin:
    profiles: ["app"]
    build:
      context: web/admin
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
