name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not use this form for security issues —
        see [SECURITY.md](https://github.com/YusufSizmaz/visa-bot/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add an HTML source with selector "…"
        2. Trigger a fetch from the panel
        3. The item is archived instead of queued
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which part?
      options:
        - Worker (fetching)
        - Worker (delivery to Telegram)
        - Web API
        - Admin panel
        - Deployment / Docker
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the log lines around the failure. Redact tokens and passwords.
      render: text

  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: e.g. main @ 26e1a4c

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: Ubuntu 24.04
        Running via: docker compose / dotnet run
        PostgreSQL: 17
