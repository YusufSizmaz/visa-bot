server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Panel ve API ayni adresten sunulur; tarayici icin CORS gerekmez.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8080/health;
    }

    # Hash'li dosya adlari degismedikce tarayici tekrar indirmez.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Tek sayfa uygulama: /sources gibi adresler de index.html'e duser, rotayi React Router cozer.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
