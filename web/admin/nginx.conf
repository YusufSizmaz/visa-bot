server {
    # Yalnizca IPv4 dinlenir: Docker aglarinda vekil (Traefik) container'a IPv4 ile baglanir ve
    # IPv6'nin kapali oldugu kurulumlarda "listen [::]:80" nginx'in hic baslamamasina yol acar.
    # Bu yuzden healthcheck de localhost degil 127.0.0.1 kullanir.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker'in yerlesik DNS'i. Adres bir degiskene yazilip oyle kullanilinca nginx her istekte
    # yeniden cozumler; api container'i yeniden dagitilip IP'si degistiginde panel kendini toparlar.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Tarayiciya giden yanitlari kucultur; SPA paketi ve JSON listeler icin belirgin fark yaratir.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Panel yalnizca kendi kokeninden calisir; disaridan cerceveye alinamaz.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Panel ve API ayni adresten sunulur; tarayici icin CORS gerekmez.
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Gorsel yukleme cok satirli multipart govde gonderir; varsayilan 1 MB sinir dusuk kalir.
        client_max_body_size 12m;
        proxy_read_timeout 60s;
    }

    location = /health {
        set $health_upstream http://api:8080/health;
        proxy_pass $health_upstream;
        access_log off;
    }

    # nginx kurali: bir location kendi add_header'ini tanimlarsa ust seviyedekiler devralinmaz.
    # Bu yuzden guvenlik basliklari asagida tekrar edilir.

    # Hash'li dosya adlari degismedikce tarayici tekrar indirmez.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Tek sayfa uygulama: /sources gibi adresler de index.html'e duser, rotayi React Router cozer.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
